name: Publish to PyPI

# Publishes on a GitHub Release. Uses PyPI Trusted Publishing (OIDC) -- configure
# the publisher once at
# https://pypi.org/manage/project/groundkit-core/settings/publishing/
# (workflow: publish.yml, environment: pypi). No API token needed.
#
# The distribution is `groundkit-core`, not `groundkit`: that name on PyPI
# belongs to an unrelated project. The import name is unchanged.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
