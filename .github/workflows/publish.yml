name: Publish to PyPI

# Publishes on a GitHub Release, using PyPI Trusted Publishing (OIDC).
#
# FIRST PUBLISH: the project does not exist on PyPI yet, so its settings page
# 404s. Add a *pending publisher* instead, at
#   https://pypi.org/manage/account/publishing/
# with: project name groundkit-core, owner ss1738, repository groundkit,
# workflow filename publish.yml, environment pypi.
# Publishing the first GitHub Release then creates the project. Afterwards it is
# managed at https://pypi.org/manage/project/groundkit-core/settings/publishing/
# No API token is involved at any point.
#
# The distribution is `groundkit-core`, not `groundkit`: that name on PyPI
# belongs to an unrelated project. The import name is unchanged.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
