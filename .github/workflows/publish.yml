name: Publish to PyPI

# DISABLED: the PyPI name `groundkit` belongs to an unrelated project
# (https://pypi.org/project/groundkit/, github.com/tafreeman/groundkit), so this
# repo cannot publish under it and a GitHub Release must not try. Trusted
# Publishing for a project we do not own cannot be configured either.
#
# To re-enable, first pick a distribution name that is free on PyPI, set it as
# `name` in pyproject.toml, configure Trusted Publishing for that project, then
# restore the `release` trigger below. Until then this runs only when dispatched
# by hand, so nothing fires accidentally.

on:
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
