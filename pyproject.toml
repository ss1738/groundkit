[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundkit"
version = "0.1.0"
description = "Deterministic-first grounding for LLM output -- a model can propose, but never assert a fact. Every value carries its provenance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satyawan Singh" }]
keywords = ["llm", "hallucination", "grounding", "rag", "faithfulness", "provenance", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# ruff is pinned to a minor range: CI runs `ruff check .`, and an unpinned
# `ruff>=0.4` silently picks up new default rules on release and breaks the build.
dev = ["pytest>=7.0", "ruff>=0.17,<0.18"]

[project.urls]
Homepage = "https://github.com/ss1738/groundkit"
Issues = "https://github.com/ss1738/groundkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["groundkit"]

[tool.ruff]
line-length = 88
target-version = "py39"
